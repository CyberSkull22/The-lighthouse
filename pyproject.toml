[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "the-lighthouse"
version = "1.0.0"
description = "Fast async network port scanner — nmap-level capabilities in pure Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
lighthouse = "the_lighthouse.main:_cli_entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["the_lighthouse*"]
